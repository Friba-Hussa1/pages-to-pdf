
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pages to PDF Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Pages to PDF Converter</h1>
    <p>Upload your Apple Pages document.</p>

    <form id="converterForm">
      <input
        type="file"
        id="pagesFile"
        accept=".pages"
        required
      >
      <button type="submit">Convert to PDF</button>
    </form>

    <p id="status"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
